name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Test package
        run: python -m unittest discover -s tests

      - name: Check patch whitespace
        run: git diff --check

  rust:
    runs-on: ubuntu-latest
    env:
      PROTO_RING_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "1.99.0"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --all-features \
            --locked \
            -- \
            -D warnings

      - name: Test Rust workspace
        run: |
          cargo test \
            --workspace \
            --all-targets \
            --all-features \
            --locked

      - name: Test Rust documentation
        run: |
          cargo test \
            --workspace \
            --doc \
            --locked

      - name: Check patch whitespace
        run: git diff --check

  rust-windows-repository-state:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and verify Rust 1.99.0
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          $version = (rustc --version).Split()[1]
          if ($version -ne "1.99.0") { throw "Expected rustc 1.99.0, got $version" }

      - name: Test RepositoryState engine
        run: cargo test -p proto-ring-engine --all-features --locked

      - name: Test Windows RepositoryState identity
        run: cargo test -p proto-ring-conformance --test issue67_windows_identity --locked

      - name: Test Git-file worktree roots
        run: cargo test -p proto-ring-conformance --test issue67_git_file_roots --locked

      - name: Test RepositoryState Rust port
        run: cargo test -p proto-ring-conformance --test issue67_rust_port --locked

      - name: Test Git discovery transport
        run: cargo test -p proto-ring-conformance --test issue67_git_discovery --locked

      - name: Test RepositoryState path boundaries
        run: cargo test -p proto-ring-conformance --test issue67_path_boundaries --locked

      - name: Test RepositoryGovernanceState Rust port
        run: cargo test -p proto-ring-conformance --test issue68_rust_port --locked
