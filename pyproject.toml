[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-ring"
version = "0.16.1"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.25.1",
    "PyYAML==6.0.2",
    "truststore==0.10.4",
]

[tool.setuptools.package-data]
proto_ring = ["data/unicode-14.0.0/CaseFolding.txt"]
