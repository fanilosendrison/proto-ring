[workspace]
members = [
    "crates/proto-ring-engine",
    "crates/proto-ring-conformance",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
yaml-rust2 = { version = "=0.13.0", default-features = false }
