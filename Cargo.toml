[workspace]
members = [
    "crates/proto-ring-engine",
    "crates/proto-ring-conformance",
    "crates/proto-ring-compat",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
cap-std = { version = "=4.0.3", default-features = false }
jsonschema = { version = "=0.58.6", default-features = false, features = ["arbitrary-precision"] }
num-bigint = "=0.5.1"
prikk-ffi = "=0.45.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
tempfile = "3.23"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
