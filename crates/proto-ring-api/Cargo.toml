[package]
name = "proto-ring-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "proto-ring"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
jsonschema.workspace = true
proto-ring-engine = { path = "../proto-ring-engine", default-features = false }
sha2.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
tempfile.workspace = true
